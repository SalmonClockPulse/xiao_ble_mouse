# Config
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_GPIO=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HIDS=y
CONFIG_BT_BAS=y

# I2C
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_GLOBAL_THREAD=y

# Log
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Device
CONFIG_BT_DEVICE_NAME="XIAO_BLE_MOUSE"
